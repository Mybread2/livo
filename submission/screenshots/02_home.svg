<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#ffffff"/>

  <!-- demo banner -->
  <rect x="16" y="56" width="358" height="40" rx="10" fill="rgba(42,82,190,0.08)" stroke="#2A52BE" stroke-width="1" stroke-opacity="0.3"/>
  <text x="30" y="81" font-family="sans-serif" font-size="12" font-weight="600" fill="#2A52BE">데모 모드 — 데이터는 저장되지 않습니다</text>
  <text x="352" y="81" font-family="sans-serif" font-size="11" fill="#6d707a" text-anchor="end">데모 종료</text>

  <!-- header -->
  <text x="20" y="130" font-family="sans-serif" font-size="18" font-weight="800" fill="#2A52BE">입모아</text>
  <text x="370" y="130" font-family="sans-serif" font-size="13" fill="#6d707a" text-anchor="end">설정</text>
  <line x1="16" y1="140" x2="374" y2="140" stroke="rgba(21,22,26,0.13)" stroke-width="1"/>

  <!-- subject card -->
  <rect x="16" y="156" width="358" height="120" rx="10" fill="#fff" stroke="rgba(21,22,26,0.13)" stroke-width="1"/>
  <text x="28" y="182" font-family="sans-serif" font-size="15" font-weight="600" fill="#15161a">데모 대상자 님</text>

  <rect x="28" y="196" width="64" height="32" rx="8" fill="#2A52BE"/>
