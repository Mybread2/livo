  <rect x="100" y="196" width="80" height="32" rx="8" fill="rgba(42,82,190,0.06)" stroke="rgba(42,82,190,0.4)" stroke-width="1"/>
  <text x="140" y="217" font-family="sans-serif" font-size="12" fill="#2A52BE" text-anchor="middle">목소리 설정</text>

  <rect x="188" y="196" width="96" height="32" rx="8" fill="#0a0a0c"/>
