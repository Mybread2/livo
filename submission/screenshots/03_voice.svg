<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1fb"/>
      <stop offset="100%" stop-color="#dce3f8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#2A52BE" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- left copy -->
  <text x="200" y="270" font-family="sans-serif" font-size="32" font-weight="800" fill="#2A52BE">목소리 선택</text>
  <text x="200" y="315" font-family="sans-serif" font-size="16" fill="#3f434c">6가지 프리셋 중 하나를 선택합니다</text>
  <text x="200" y="355" font-family="sans-serif" font-size="13" fill="#6d707a">ElevenLabs API로 등록 문장을</text>
  <text x="200" y="378" font-family="sans-serif" font-size="13" fill="#6d707a">사전 합성·캐시하여 즉시 재생합니다</text>
  <text x="200" y="420" font-family="sans-serif" font-size="13" fill="#6d707a">· 성별 · 연령대별 6종</text>
  <text x="200" y="443" font-family="sans-serif" font-size="13" fill="#6d707a">· 미리듣기 지원</text>
  <text x="200" y="466" font-family="sans-serif" font-size="13" fill="#6d707a">· 나중에 변경 가능</text>

  <!-- phone frame -->
  <rect x="760" y="40" width="320" height="640" rx="36" fill="#1a1a1e" filter="url(#shadow)"/>
  <rect x="768" y="48" width="304" height="624" rx="28" fill="#ffffff"/>
  <rect x="876" y="52" width="88" height="20" rx="10" fill="#1a1a1e"/>

  <text x="786" y="92" font-family="sans-serif" font-size="11" fill="#6d707a">← 홈</text>
  <text x="786" y="118" font-family="sans-serif" font-size="17" font-weight="700" fill="#15161a">목소리 고르기</text>
  <text x="786" y="136" font-family="sans-serif" font-size="11" fill="#5c5f67">듣고 고릅니다. 나중에 바꿀 수 있습니다.</text>

