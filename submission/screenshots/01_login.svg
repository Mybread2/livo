<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1fb"/>
      <stop offset="100%" stop-color="#dce3f8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#2A52BE" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- left copy -->
  <text x="200" y="280" font-family="sans-serif" font-size="40" font-weight="800" fill="#2A52BE">입모아</text>
  <text x="200" y="330" font-family="sans-serif" font-size="18" fill="#3f434c">입모양이 목소리가 됩니다</text>
  <text x="200" y="362" font-family="sans-serif" font-size="14" fill="#6d707a">발성이 어려운 분을 위한</text>
  <text x="200" y="382" font-family="sans-serif" font-size="14" fill="#6d707a">보완대체 의사소통(AAC) 서비스</text>

  <!-- phone frame -->
  <rect x="760" y="40" width="320" height="640" rx="36" fill="#1a1a1e" filter="url(#shadow)"/>
  <rect x="768" y="48" width="304" height="624" rx="28" fill="#ffffff"/>

  <!-- notch -->
  <rect x="876" y="52" width="88" height="20" rx="10" fill="#1a1a1e"/>

  <!-- screen content: login -->
  <text x="920" y="310" font-family="sans-serif" font-size="22" font-weight="800" fill="#2A52BE" text-anchor="middle">입모아</text>
  <text x="920" y="335" font-family="sans-serif" font-size="12" fill="#6d707a" text-anchor="middle">보호자 계정으로 시작합니다</text>

  <!-- google btn -->
  <rect x="792" y="520" width="256" height="44" rx="10" fill="#2A52BE"/>
  <text x="920" y="547" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Google로 계속하기</text>

  <!-- demo btn -->
  <rect x="792" y="572" width="256" height="42" rx="10" fill="rgba(42,82,190,0.07)" stroke="#2A52BE" stroke-width="1" stroke-opacity="0.4"/>
  <text x="920" y="598" font-family="sans-serif" font-size="13" font-weight="700" fill="#2A52BE" text-anchor="middle">로그인 없이 데모 체험</text>

  <text x="920" y="640" font-family="sans-serif" font-size="10" fill="#9a9ca3" text-anchor="middle">병상 태블릿은 한 번 로그인하면 유지됩니다.</text>
</svg>
