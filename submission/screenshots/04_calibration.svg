<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect width="390" height="844" fill="#0a0a0c"/>

  <!-- 카메라 프리뷰 영역 -->
  <rect x="0" y="0" width="390" height="480" fill="#1a1a1e"/>
  <!-- 얼굴 윤곽 가이드 -->
  <ellipse cx="195" cy="230" rx="100" ry="130" fill="none" stroke="rgba(42,82,190,0.6)" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- 입술 랜드마크 시각화 -->
  <ellipse cx="195" cy="310" rx="32" ry="14" fill="none" stroke="#2A52BE" stroke-width="1.5"/>
  <circle cx="163" cy="310" r="3" fill="#2A52BE"/>
  <circle cx="179" cy="305" r="3" fill="#2A52BE"/>
  <circle cx="195" cy="302" r="3" fill="#2A52BE"/>
  <circle cx="211" cy="305" r="3" fill="#2A52BE"/>
  <circle cx="227" cy="310" r="3" fill="#2A52BE"/>
  <circle cx="195" cy="322" r="3" fill="#2A52BE"/>

  <!-- 문장 표시 박스 -->
  <rect x="16" y="500" width="358" height="80" rx="12" fill="rgba(42,82,190,0.12)" stroke="rgba(42,82,190,0.4)" stroke-width="1"/>
  <text x="195" y="535" font-family="sans-serif" font-size="11" fill="#6d707a" text-anchor="middle">따라 하세요</text>
  <text x="195" y="562" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">물 주세요</text>

  <!-- progress dots -->
  <circle cx="171" cy="616" r="5" fill="#2A52BE"/>
  <circle cx="187" cy="616" r="5" fill="rgba(42,82,190,0.3)"/>
  <circle cx="203" cy="616" r="5" fill="rgba(42,82,190,0.3)"/>
  <circle cx="219" cy="616" r="5" fill="rgba(42,82,190,0.3)"/>

  <text x="195" y="660" font-family="sans-serif" font-size="13" fill="#6d707a" text-anchor="middle">1 / 15 · 손을 쓰지 않아도 됩니다</text>

  <!-- recording indicator -->
  <circle cx="195" cy="730" r="28" fill="#2A52BE"/>
  <circle cx="195" cy="730" r="14" fill="#ffffff"/>

  <text x="195" y="800" font-family="sans-serif" font-size="11" fill="#6d707a" text-anchor="middle">입모양이 인식되면 자동으로 다음 문장으로 넘어갑니다</text>

  <text x="195" y="830" font-family="sans-serif" font-size="11" fill="#555" text-anchor="middle">→ 실제 캡처로 교체: /calibration</text>
</svg>
