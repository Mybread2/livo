<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#12131a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#2A52BE" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- left copy -->
  <text x="140" y="270" font-family="sans-serif" font-size="32" font-weight="800" fill="#2A52BE">캘리브레이션</text>
  <text x="140" y="316" font-family="sans-serif" font-size="16" fill="#e0e0e0">입모양을 따라 하면</text>
  <text x="140" y="341" font-family="sans-serif" font-size="16" fill="#e0e0e0">개인 템플릿이 기기에 저장됩니다</text>
  <text x="140" y="390" font-family="sans-serif" font-size="13" fill="#6d707a">· 손을 전혀 쓰지 않아도 됩니다</text>
  <text x="140" y="413" font-family="sans-serif" font-size="13" fill="#6d707a">· 인식 즉시 자동으로 다음 문장</text>
  <text x="140" y="436" font-family="sans-serif" font-size="13" fill="#6d707a">· MediaPipe — 브라우저 내 추론</text>
  <text x="140" y="459" font-family="sans-serif" font-size="13" fill="#6d707a">· 영상은 외부로 전송되지 않음</text>

  <!-- phone frame -->
  <rect x="760" y="40" width="320" height="640" rx="36" fill="#111114" filter="url(#shadow)"/>
  <rect x="768" y="48" width="304" height="624" rx="28" fill="#0d0d10"/>
  <rect x="876" y="52" width="88" height="20" rx="10" fill="#111114"/>

  <!-- camera feed area -->
  <rect x="768" y="48" width="304" height="360" rx="28" fill="#1a1a1e"/>

  <!-- face outline guide -->
  <ellipse cx="920" cy="230" rx="80" ry="110" fill="none" stroke="rgba(42,82,190,0.5)" stroke-width="1.5" stroke-dasharray="7 4"/>

  <!-- lip landmarks -->
  <ellipse cx="920" cy="305" rx="28" ry="12" fill="none" stroke="#2A52BE" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="892" cy="305" r="3" fill="#2A52BE"/>
  <circle cx="904" cy="299" r="3" fill="#2A52BE"/>
  <circle cx="920" cy="296" r="3" fill="#2A52BE"/>
  <circle cx="936" cy="299" r="3" fill="#2A52BE"/>
  <circle cx="948" cy="305" r="3" fill="#2A52BE"/>
  <circle cx="920" cy="315" r="3" fill="#2A52BE"/>

  <!-- phrase box -->
  <rect x="780" y="418" width="280" height="68" rx="12" fill="rgba(42,82,190,0.12)" stroke="rgba(42,82,190,0.4)" stroke-width="1"/>
  <text x="920" y="444" font-family="sans-serif" font-size="10" fill="#6d707a" text-anchor="middle">따라 하세요</text>
  <text x="920" y="470" font-family="sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">물 주세요</text>

  <!-- progress -->
  <circle cx="904" cy="506" r="5" fill="#2A52BE"/>
  <circle cx="918" cy="506" r="5" fill="rgba(42,82,190,0.3)"/>
  <circle cx="932" cy="506" r="5" fill="rgba(42,82,190,0.3)"/>
  <circle cx="946" cy="506" r="5" fill="rgba(42,82,190,0.3)"/>
  <text x="920" y="530" font-family="sans-serif" font-size="10" fill="#6d707a" text-anchor="middle">1 / 15</text>

  <!-- record btn -->
  <circle cx="920" cy="590" r="26" fill="#2A52BE"/>
  <circle cx="920" cy="590" r="13" fill="#ffffff"/>

  <text x="920" y="636" font-family="sans-serif" font-size="10" fill="#555" text-anchor="middle">인식되면 자동으로 다음 문장으로 넘어갑니다</text>
</svg>
